name: One-time DBZ sprite replacement

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/replace-dbz-sprite.yml"
      - "scripts/replace_dbz_sprite.py"

permissions:
  contents: write

jobs:
  replace-sprite:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install image processing dependency
        run: python -m pip install --disable-pip-version-check Pillow requests

      - name: Download, process, and validate sprite
        run: python scripts/replace_dbz_sprite.py

      - name: Commit the final image and CSS mapping
        run: |
          rm -f .github/workflows/replace-dbz-sprite.yml scripts/replace_dbz_sprite.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Replace final DBZ stages with Goku God and Blue"
          git push
