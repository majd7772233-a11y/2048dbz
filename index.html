<!DOCTYPE html>
<html lang="ar">
<head>
  <meta charset="utf-8">
  <title>2048DBZ</title>

  <link href="style/main.css" rel="stylesheet" type="text/css">
  <link rel="shortcut icon" href="favicon.ico">
  <link rel="apple-touch-icon" href="meta/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">

  <meta name="HandheldFriendly" content="True">
  <meta name="MobileOptimized" content="320">
  <meta name="viewport" content="width=device-width, target-densitydpi=160dpi, initial-scale=1.0, maximum-scale=1, user-scalable=no, minimal-ui">

  <meta property="og:title" content="نسخة دراغون بول زد من لعبة 2048"/>
  <meta property="og:site_name" content="نسخة دراغون بول زد من لعبة 2048"/>
  <meta property="og:description" content="ادمج شخصيات غوكو من نفس المستوى لتطويره حتى سوبر سايان 4! انتبه: اللعبة تسبب الإدمان بشدة!"/>
  <meta property="og:image" content="https://majd7772233-a11y.github.io/2048dbz/meta/og_image.png"/>
</head>
<body>
  <div class="container">
    <div class="header">
      <div class="heading">
        <h1 class="title">2048DBZ</h1>
        <div class="scores-container">
          <div class="score-container">0</div>
          <div class="best-container">0</div>
        </div>
      </div>
      <p class="game-intro">ادمج شخصيات غوكو من نفس المستوى لتطويره حتى <strong>سوبر سايان 4!</strong></p>
    </div>

    <div class="game-container">
      <div id="vegeta-scouter">
        <img src="img/scouter.png" >
        <div id="scouter-deco"><div id="scouter-deco-arrow-left" class="blink">◀</div><div id="scouter-deco-arrow-right" class="blink">▶</div><div id="scouter-deco-arrow-down" class="blink">▼</div><div id="scouter-deco-circle">○</div></div>
        <div id="scouter-score">0</div>
      </div>
      <div class="game-message">
        <p></p>
        <div class="lower">
          <a class="keep-playing-button">مواصلة اللعب</a>
          <a class="retry-button">إعادة المحاولة</a><br />
          <div class="sharing">
            <iframe src="https://ghbtns.com/github-btn.html?user=majd7772233-a11y&repo=2048dbz&type=watch&count=true"
              allowtransparency="true" frameborder="0" scrolling="0" width="100" height="20"></iframe>
          </div>
        </div>
      </div>

      <div class="grid-container">
        <div class="grid-row">
          <div class="grid-cell"></div>
          <div class="grid-cell"></div>
          <div class="grid-cell"></div>
          <div class="grid-cell"></div>
        </div>
        <div class="grid-row">
          <div class="grid-cell"></div>
          <div class="grid-cell"></div>
          <div class="grid-cell"></div>
          <div class="grid-cell"></div>
        </div>
        <div class="grid-row">
          <div class="grid-cell"></div>
          <div class="grid-cell"></div>
          <div class="grid-cell"></div>
          <div class="grid-cell"></div>
        </div>
        <div class="grid-row">
          <div class="grid-cell"></div>
          <div class="grid-cell"></div>
          <div class="grid-cell"></div>
          <div class="grid-cell"></div>
        </div>
      </div>

      <div class="tile-container">

      </div>
    </div>

    <p class="game-explanation">
      <strong class="important">طريقة اللعب:</strong> استخدم <strong>مفاتيح الأسهم</strong> (أو السحب باللمس على هاتفك) لتحريك المربعات. عندما يلتقي مربعان من نفس مرحلة غوكو، فإنهما <strong>يندمجان في مرحلة أكثر قوة!</strong>
    </p>
    <hr>
    <p>تم التطوير بواسطة <a href="https://github.com/majd7772233-a11y/2048dbz" target="_blank">مجد انور</a></p>
    <div class="sharing">
      <iframe src="https://ghbtns.com/github-btn.html?user=majd7772233-a11y&repo=2048dbz&type=watch&count=true"
        allowtransparency="true" frameborder="0" scrolling="0" width="100" height="20"></iframe>
    </div>
  </div>

  <script src="js/classlist_polyfill.js"></script>
  <script src="js/animframe_polyfill.js"></script>
  <script src="js/keyboard_input_manager.js"></script>
  <script src="js/html_actuator.js"></script>
  <script src="js/grid.js"></script>
  <script src="js/tile.js"></script>
  <script src="js/local_score_manager.js"></script>
  <script src="js/game_manager.js"></script>
  <script src="js/application.js"></script>

</body>
</html>
